<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<title>3 Segundos</title>
<style>
:root{--brain:#2343e0;--phys:#f0302f;--cyan:#27c3e6;--ink:#111827;--glass:rgba(255,255,255,.08);--y:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Fredoka",system-ui,sans-serif;color:#fff;background:#0b0c14;background-image:radial-gradient(circle at 0% 0%,rgba(35,67,224,.5),transparent 45%),radial-gradient(circle at 100% 100%,rgba(240,48,47,.45),transparent 45%);background-attachment:fixed;overflow-x:hidden}
#app{max-width:520px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;gap:14px;animation:entra .3s ease}
@keyframes entra{from{opacity:0;transform:translateY(10px)}}
h1{font-size:2.3rem;margin:0;text-align:center;line-height:1.05}
h2{margin:0;font-size:1.4rem}
.sub{color:#b9bfd6;text-align:center;margin:0}
.sub2{color:#6b7280;margin:4px 0}
.center{text-align:center}
.big{font-size:3.6rem;text-align:center;line-height:1.1}
.bob{display:inline-block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
.logo{text-align:center;font-weight:700;line-height:.9}
.logo .n{display:block;font-size:7rem;color:var(--y);text-shadow:0 7px 0 #b88a00}
.logo .t{font-size:2.6rem;letter-spacing:2px}
.card{background:#fff;color:var(--ink);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.glass{background:var(--glass);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px;line-height:1.4}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;font:700 1.15rem "Fredoka",sans-serif;cursor:pointer;background:linear-gradient(180deg,#ffe066,var(--y));color:#3b2a00;box-shadow:0 5px 0 #b88a00;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b88a00}
.btn.sec{background:var(--glass);color:#fff;border:1px solid rgba(255,255,255,.18);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn.red{background:linear-gradient(180deg,#ff5a59,var(--phys));color:#fff;box-shadow:0 5px 0 #8f1212}
.btn.green{background:linear-gradient(180deg,#4ff0b5,#12b981);color:#03301f;box-shadow:0 5px 0 #08734f}
.btn.ghost{background:#eef1f8;color:var(--ink);box-shadow:0 5px 0 #c9cfdd}
.btn:disabled{opacity:.4;pointer-events:none}
.parar{font-size:2.2rem;padding:30px;border-radius:26px}
.col{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px}
.top{display:flex;gap:6px;justify-content:space-between}
.ic{background:var(--glass);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 10px;font:600 .85rem "Fredoka";cursor:pointer}
input[type=text],input[type=number],textarea,select{padding:12px;border-radius:14px;border:2px solid #d7dbe7;font:600 1rem "Fredoka";color:var(--ink);width:100%;background:#fff}
textarea{resize:none;margin-top:10px}
input:focus,textarea:focus{outline:none;border-color:var(--brain)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;border:2px solid var(--brain);background:#fff;color:var(--brain);font:600 .95rem "Fredoka";cursor:pointer}
.chip.on{background:var(--brain);color:#fff}
.plist{list-style:none;padding:0;margin:10px 0 0}
.plist li{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px dashed #e2e5ee;font-weight:600}
.x{background:#ffe5e5;border:0;border-radius:10px;color:var(--phys);width:32px;height:32px;cursor:pointer;font-weight:700}
.decks{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.deck{border:0;border-radius:20px;aspect-ratio:3/4;color:#fff;font:700 1.5rem "Fredoka";letter-spacing:1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.4);transition:transform .1s}
.deck span{font-size:3rem}.deck small{font-size:.85rem;font-weight:500;opacity:.9;letter-spacing:0}
.deck:active{transform:translateY(6px) rotate(-2deg)}
.brain-bg{background:repeating-linear-gradient(-35deg,var(--brain) 0 14px,#2f52f5 14px 28px)}
.phys-bg{background:repeating-linear-gradient(-35deg,var(--phys) 0 14px,#ff4847 14px 28px)}
.carta{background:#fff;color:var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:flip .5s ease}
@keyframes flip{from{transform:perspective(800px) rotateY(90deg)}}
.carta .faixa{padding:8px 14px;color:#fff;font-weight:700;letter-spacing:2px}
.carta .ct{font-size:1.4rem;font-weight:600;padding:18px 18px 22px;margin:0;text-align:center;line-height:1.3}
.meta{font-size:5rem;font-weight:700;color:var(--y);text-align:center;line-height:1;text-shadow:0 5px 0 rgba(0,0,0,.4)}
.pistaBox{display:flex;align-items:center;justify-content:center;gap:14px}
#pista{height:min(46vh,380px)}
.cont{font-size:3.2rem;font-weight:700;min-width:96px;text-align:center;color:var(--cyan)}
.lance{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #e2e5ee;font-weight:600}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:12px;border:0;background:#eef1f8;font:700 1.3rem "Fredoka";cursor:pointer}
.step input{width:66px;text-align:center;font-size:1.3rem;padding:8px}
.dup{border-color:var(--phys)!important;background:#ffe5e5!important;animation:shake .4s}
.score{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px dashed #e2e5ee;font-weight:600}
.score.novo{background:#fff8d6;border-radius:10px}
.mc{display:inline-flex;width:26px;height:34px;border-radius:6px;align-items:center;justify-content:center;font-size:.85rem;font-style:normal;margin-left:4px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.mc.brain{background:var(--brain)}.mc.phys{background:var(--phys)}
.mc.vazio{border:2px dashed #c5cad8;box-shadow:none}
.mini{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mini span{background:var(--glass);border-radius:999px;padding:3px 10px;font-size:.9rem}
.centro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.manual h3{color:var(--brain);margin:14px 0 4px}.manual p{line-height:1.45;margin:.4em 0}
.tag{display:inline-block;background:rgba(255,210,63,.18);color:var(--y);border-radius:10px;padding:2px 10px;font-weight:600}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(5,6,12,.78);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;backdrop-filter:blur(4px)}
.modal .card{max-width:420px;width:100%;max-height:85vh;overflow:auto;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-180%);background:#fff;color:var(--ink);font-weight:600;padding:10px 18px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .3s;z-index:30;text-align:center;max-width:90vw}
#toast.show{transform:translate(-50%,0)}
.confete{position:fixed;top:-40px;pointer-events:none;z-index:20;animation:cair 3.2s linear forwards}
@keyframes cair{to{transform:translateY(115vh) rotate(540deg)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<script src="cartas.js"></script>
<script src="app.js"></script>
</body>
</html>
